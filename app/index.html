<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BDR Bullpen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --s4-blue: #146ef6; --s4-blue-d: #0f52c9; --s4-line: #58aafd; --s4-line-bright: #8fc4ff;
    --ink-0: #ffffff; --ink-1: #c6d4ea; --ink-2: #93a7c4; --ink-3: #7e93b3;
    --glass: rgba(13, 24, 42, .82); --glass-2: rgba(8, 14, 26, .88);
    --glass-border: rgba(88, 170, 253, .16); --hairline: rgba(255,255,255,.10);
    --field: rgba(255,255,255,.05);
    --green: #22bb5b; --green-d: #0f8a3c; --green-t: #4ade80;
    --red: #dc2626; --red-t: #ff9d9d;
    --amber: #f7ac63; --amber-d: #c2660f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; }
  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif; color: var(--ink-0);
    min-height: 100vh; display: flex; flex-direction: column; position: relative;
    isolation: isolate; overflow-x: hidden;
    background:
      radial-gradient(ellipse 1400px 1000px at 75% 20%, #0c1b31 0%, #060b14 55%, #000 100%);
  }

  /* ================= GLOBE ================= */
  .globe-wrap {
    position: fixed; top: 50%; right: -14vw; transform: translateY(-48%);
    width: min(118vh, 1050px); height: min(118vh, 1050px);
    z-index: -1; pointer-events: none; opacity: .95;
  }
  .globe-wrap svg { width: 100%; height: 100%; display: block; }
  .dots-scroll { animation: dotsDrift 40s linear infinite; }
  @keyframes dotsDrift { from { transform: translateX(0); } to { transform: translateX(-288px); } }
  .flow { stroke-dasharray: 3 14; animation: dashFlow 9s linear infinite; }
  .flow.slow { animation-duration: 14s; }
  .flow.rev { animation-direction: reverse; }
  @keyframes dashFlow { to { stroke-dashoffset: -340; } }
  .node { animation: nodePulse 5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .node.d1 { animation-delay: 1.2s; } .node.d2 { animation-delay: 2.4s; }
  .node.d3 { animation-delay: 3.4s; } .node.d4 { animation-delay: 4.2s; }
  @keyframes nodePulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots-scroll, .flow, .node { animation: none; } }
  @media (max-width: 760px) {
    .globe-wrap { width: 150vw; height: 150vw; right: -70vw; top: 60%; opacity: .55; }
  }
  .glow-corner {
    position: fixed; width: 560px; height: 560px; bottom: -260px; left: -240px; border-radius: 50%;
    background: radial-gradient(circle, rgba(20,110,246,.12), transparent 70%); z-index: -1;
    pointer-events: none; filter: blur(8px);
  }

  /* ================= "4" WATERMARK ================= */
  .watermark {
    position: fixed; left: 3vw; bottom: 4vh;
    width: min(64vh, 620px); height: min(64vh, 620px);
    z-index: -1; pointer-events: none; opacity: .11; user-select: none;
  }
  .watermark svg { width: 100%; height: 100%; display: block; }
  .watermark text { font-family: 'Poppins', sans-serif; font-weight: 700; }
  @media (max-width: 760px) { .watermark { width: 90vw; height: 90vw; left: -22vw; bottom: -10vh; opacity: .04; } }

  /* ================= HEADER ================= */
  header {
    width: 100%; background: rgba(0,0,0,.35); backdrop-filter: blur(10px); position: relative; z-index: 2;
    padding: 16px 28px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(88,170,253,.14);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo-word { font-family: 'Poppins', sans-serif; font-weight: 600; letter-spacing: .14em; font-size: 16px; color: #fff; }
  .brand .logo-4 {
    display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
    border: 2px solid var(--s4-blue); border-radius: 50%; color: var(--s4-blue); font-weight: 700; font-size: 12px;
  }
  .brand .brand-sub { font-size: 13px; color: var(--ink-3); font-weight: 600; margin-left: 6px; padding-left: 12px; border-left: 1px solid rgba(255,255,255,.14); }
  header .who { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 14px; }
  header .who #whoEmail { color: var(--ink-1); font-weight: 500; }
  a.signout { color: var(--ink-3); text-decoration: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: color .15s; }
  a.signout:hover { color: #fff; }

  /* ================= LAYOUT ================= */
  main {
    flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px; position: relative; z-index: 1;
  }
  .stack { width: 100%; max-width: 450px; }

  .kicker {
    display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 800;
    color: var(--s4-line); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 12px;
  }
  .kicker::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--s4-blue); box-shadow: 0 0 8px var(--s4-blue); }

  /* ================= CARD ================= */
  .card {
    background: linear-gradient(180deg, var(--glass), var(--glass-2));
    border: 1px solid var(--glass-border); border-radius: 24px;
    padding: 38px 34px; position: relative; overflow: hidden;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 30px 60px -16px rgba(0,0,0,.7), 0 0 60px -20px rgba(20,110,246,.25);
    animation: cardIn .4s cubic-bezier(.2,.8,.25,1);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card::before {
    content: ''; position: absolute; top: 0; left: 24px; right: 24px; height: 1.5px;
    background: linear-gradient(90deg, transparent, var(--s4-blue) 30%, #5b9bff 70%, transparent);
  }
  .center { text-align: center; }
  h1 { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 25px; margin: 0 0 6px; color: var(--ink-0); letter-spacing: -.01em; }
  p.sub { color: var(--ink-2); font-size: 14.5px; line-height: 1.55; margin: 0 0 26px; }

  label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800; color: var(--ink-3); margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .06em; }
  label:first-of-type { margin-top: 0; }

  .input-wrap { position: relative; }
  .input-wrap .prefix { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-weight: 700; font-size: 16px; pointer-events: none; }
  input[type="number"] {
    width: 100%; padding: 13px 14px 13px 31px; border: 1.5px solid var(--hairline); border-radius: 13px; font-size: 16px;
    font-family: inherit; font-weight: 600; background: var(--field); color: var(--ink-0); transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input[type="number"]::placeholder { color: #55677f; font-weight: 500; }
  input[type="number"]:focus { outline: none; border-color: var(--s4-blue); background: rgba(20,110,246,.07); box-shadow: 0 0 0 4px rgba(20,110,246,.18); }

  .segmented { display: flex; gap: 4px; background: rgba(255,255,255,.06); border: 1px solid var(--hairline); border-radius: 13px; padding: 4px; }
  .segmented button {
    flex: 1; padding: 10px; border: none; background: transparent; border-radius: 9px;
    font-size: 14px; font-weight: 700; cursor: pointer; color: var(--ink-2); font-family: inherit; transition: all .15s;
  }
  .segmented button.active { background: var(--s4-blue); color: #fff; box-shadow: 0 2px 12px rgba(20,110,246,.5); }

  /* ================= BUTTONS ================= */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px;
    margin: 8px 0; font-size: 14.5px; font-weight: 700; border: none; border-radius: 13px; cursor: pointer;
    transition: opacity .15s, transform .05s, box-shadow .15s, background .15s; font-family: inherit;
  }
  .btn svg { width: 17px; height: 17px; flex-shrink: 0; }
  .btn:hover { opacity: .95; }
  .btn:active { transform: scale(.985); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(180deg, #1f7dff, var(--s4-blue-d)); color: #fff;
    box-shadow: 0 6px 22px rgba(20,110,246,.5), 0 1px 0 rgba(255,255,255,.2) inset; margin-top: 26px;
  }
  .btn-primary:hover { box-shadow: 0 8px 26px rgba(20,110,246,.6), 0 1px 0 rgba(255,255,255,.2) inset; }
  .btn-yes { background: linear-gradient(180deg, var(--green), var(--green-d)); color: #fff; box-shadow: 0 6px 20px rgba(34,187,91,.35), 0 1px 0 rgba(255,255,255,.2) inset; }
  .btn-no { background: rgba(220,38,38,.08); color: var(--red-t); border: 1.5px solid rgba(220,38,38,.45); }
  .btn-no:hover { background: rgba(220,38,38,.16); }
  .btn-recall { background: linear-gradient(180deg, var(--amber), var(--amber-d)); color: #fff; box-shadow: 0 6px 20px rgba(242,153,74,.35), 0 1px 0 rgba(255,255,255,.2) inset; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { margin: 8px 0; }
  .btn-google { background: #fff; color: #10131a; font-weight: 600; }
  .btn-google:hover { background: #eef2f8; }
  .link-cancel {
    display: block; width: 100%; text-align: center; background: none; border: none; cursor: pointer;
    color: var(--ink-3); font-size: 13px; font-weight: 600; font-family: inherit; padding: 14px 0 0;
    text-decoration: underline; text-decoration-color: rgba(126,147,179,.35); transition: color .15s;
  }
  .link-cancel:hover { color: #fff; }

  /* ================= PROPOSAL ================= */
  .badge-type {
    display: inline-flex; align-items: center; gap: 6px; background: rgba(20,110,246,.16); color: #7db4ff;
    border: 1px solid rgba(20,110,246,.4); font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .06em; padding: 6px 13px; border-radius: 999px; margin: 0 auto 20px; width: fit-content;
  }
  .avatar {
    width: 82px; height: 82px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center;
    justify-content: center; background: linear-gradient(160deg, #2a86ff, var(--s4-blue-d)); color: #fff;
    font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 28px;
    box-shadow: 0 10px 28px -6px rgba(20,110,246,.6), 0 0 0 5px rgba(20,110,246,.14);
  }
  .rep-name { font-family: 'Poppins', sans-serif; font-size: 28px; font-weight: 800; color: var(--ink-0); text-align: center; margin: 0 0 22px; letter-spacing: -.01em; }
  .stat-box {
    background: rgba(255,255,255,.045); border: 1px solid var(--hairline); border-radius: 15px; padding: 15px 19px;
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;
  }
  .stat-box .stat-label { font-size: 11px; font-weight: 800; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
  .stat-box .stat-value { font-family: 'Poppins', sans-serif; font-size: 19px; font-weight: 800; color: var(--ink-0); }

  /* ================= FEEDBACK ================= */
  .error {
    background: rgba(220,38,38,.12); border: 1px solid rgba(220,38,38,.4); color: #ffb4b4;
    padding: 12px 14px; border-radius: 13px; font-size: 13px; font-weight: 500; margin-top: 16px;
  }
  .success-icon {
    width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 18px; display: flex; align-items: center;
    justify-content: center; background: rgba(34,187,91,.14); color: var(--green-t);
    box-shadow: inset 0 0 0 2px rgba(34,187,91,.45), 0 0 40px -8px rgba(34,187,91,.5);
  }
  .success-icon svg { width: 32px; height: 32px; }
  .success .card-body-text { text-align: center; font-size: 16px; font-weight: 600; color: var(--ink-0); margin-bottom: 4px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ================= ANIMATED WIREFRAME GLOBE ================= -->
<div class="globe-wrap" aria-hidden="true">
  <svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="sphereFill" cx="36%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#10233f"/>
        <stop offset="60%" stop-color="#060e1c"/>
        <stop offset="100%" stop-color="#02060d"/>
      </radialGradient>
      <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#8fc4ff" stop-opacity=".9"/>
        <stop offset="55%" stop-color="#58aafd" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#146ef6" stop-opacity=".25"/>
      </linearGradient>
      <radialGradient id="fadeMask" cx="38%" cy="32%" r="72%">
        <stop offset="0%" stop-color="#fff"/>
        <stop offset="70%" stop-color="#fff" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#fff" stop-opacity=".08"/>
      </radialGradient>
      <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.3" fill="#58aafd"/>
      </pattern>
      <mask id="sphereMask">
        <circle cx="400" cy="400" r="318" fill="url(#fadeMask)"/>
      </mask>
      <filter id="glowF" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- outer orbital rings -->
    <circle cx="400" cy="400" r="384" stroke="#041938" stroke-width="20" opacity=".9"/>
    <circle cx="400" cy="400" r="352" stroke="#010c1c" stroke-width="10"/>
    <circle cx="400" cy="400" r="384" stroke="url(#lineGrad)" stroke-width="1" opacity=".35" class="flow slow"/>

    <!-- sphere body -->
    <circle cx="400" cy="400" r="320" fill="url(#sphereFill)"/>
    <circle cx="400" cy="400" r="320" stroke="url(#lineGrad)" stroke-width="1.6" opacity=".8"/>

    <!-- drifting dot texture, clipped to sphere -->
    <g mask="url(#sphereMask)" opacity=".5">
      <g class="dots-scroll">
        <rect x="60" y="80" width="1300" height="640" fill="url(#dotGrid)"/>
      </g>
    </g>

    <!-- graticule -->
    <g mask="url(#sphereMask)" stroke="url(#lineGrad)">
      <!-- meridians -->
      <ellipse cx="400" cy="400" rx="60"  ry="320" stroke-width="1.1" opacity=".75"/>
      <ellipse cx="400" cy="400" rx="140" ry="320" stroke-width="1.1" opacity=".6"/>
      <ellipse cx="400" cy="400" rx="225" ry="320" stroke-width="1.2" opacity=".7" class="flow"/>
      <ellipse cx="400" cy="400" rx="292" ry="320" stroke-width="1.1" opacity=".55"/>
      <!-- parallels -->
      <ellipse cx="400" cy="176" rx="211" ry="34" stroke-width="1.1" opacity=".6"/>
      <ellipse cx="400" cy="288" rx="293" ry="46" stroke-width="1.1" opacity=".7" class="flow rev slow"/>
      <ellipse cx="400" cy="400" rx="320" ry="50" stroke-width="1.4" opacity=".85"/>
      <ellipse cx="400" cy="512" rx="293" ry="46" stroke-width="1.1" opacity=".6"/>
      <ellipse cx="400" cy="624" rx="211" ry="34" stroke-width="1.1" opacity=".45"/>
    </g>

    <!-- glowing nodes -->
    <g fill="#8fc4ff" filter="url(#glowF)">
      <circle class="node"    cx="400" cy="176" r="4"/>
      <circle class="node d1" cx="575" cy="300" r="4.5"/>
      <circle class="node d2" cx="290" cy="446" r="4"/>
      <circle class="node d3" cx="472" cy="560" r="3.6"/>
      <circle class="node d4" cx="196" cy="330" r="3.4"/>
      <circle class="node d2" cx="628" cy="452" r="3.2"/>
    </g>
  </svg>
</div>
<div class="glow-corner" aria-hidden="true"></div>

<!-- big greyed-out "4" brand watermark -->
<div class="watermark" aria-hidden="true">
  <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="200" cy="200" r="170" stroke="#8fc4ff" stroke-width="26"/>
    <text x="200" y="216" text-anchor="middle" dominant-baseline="middle" font-size="238" fill="#8fc4ff">4</text>
  </svg>
</div>

<header>
  <div class="brand">
    <span class="logo-word">SHIFT</span><span class="logo-4">4</span>
    <span class="brand-sub">Bullpen</span>
  </div>
  <div class="who hidden" id="whoBox">
    <span id="whoEmail"></span>
    <a class="signout" id="signOutBtn">Sign out</a>
  </div>
</header>

<main>
<div class="stack">

  <!-- LOGIN VIEW -->
  <div id="loginView" class="card center hidden">
    <div class="kicker">Bullpen Router</div>
    <h1>Sign in to route a lead</h1>
    <p class="sub">shift4.com Google accounts only.</p>
    <button class="btn btn-google" id="googleBtn">
      <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.9 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5c-7.7 0-14.4 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.5c-2 1.5-4.6 2.4-7.6 2.4-5.2 0-9.6-3.1-11.3-7.6l-6.6 5.1C9.5 39 16.2 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.5 5.5C41.5 36 43.5 30.4 43.5 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google
    </button>
    <div id="loginError" class="error hidden"></div>
  </div>

  <!-- LEAD ENTRY VIEW -->
  <div id="entryView" class="card hidden">
    <div class="kicker">New Lead</div>
    <h1>Route an inbound lead</h1>
    <p class="sub">Enter the deal's TTV and whether it's hospitality.</p>

    <label for="ttvInput">Terminal Transaction Volume</label>
    <div class="input-wrap">
      <span class="prefix">$</span>
      <input type="number" id="ttvInput" placeholder="45,000" min="1" step="1" />
    </div>

    <label>Shift4 Dine / Hospitality?</label>
    <div class="segmented">
      <button type="button" id="hospNoBtn" class="active">No</button>
      <button type="button" id="hospYesBtn">Yes</button>
    </div>

    <button class="btn btn-primary" id="getAssignmentBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      Get Assignment
    </button>
    <div id="entryError" class="error hidden"></div>
  </div>

  <!-- PROPOSAL VIEW -->
  <div id="proposalView" class="card hidden">
    <div class="badge-type" id="assignmentType">—</div>
    <div class="avatar" id="repAvatar">—</div>
    <div class="rep-name" id="repName">—</div>

    <div class="stat-box">
      <span class="stat-label">Allocated Volume</span>
      <span class="stat-value" id="repVolume">$0</span>
    </div>

    <div class="btn-row">
      <button class="btn btn-yes" id="yesBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Yes
      </button>
      <button class="btn btn-no" id="noBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        No, re-spin
      </button>
    </div>
    <button class="btn btn-recall hidden" id="recallBtn">DIRECT LOG TO —</button>

    <button class="link-cancel" id="cancelBtn">Cancel / fix typo</button>
    <div id="proposalError" class="error hidden"></div>
  </div>

  <!-- SUCCESS VIEW -->
  <div id="successView" class="card success hidden">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="card-body-text" id="successMessage"></div>
    <button class="btn btn-primary" id="nextLeadBtn" style="margin-top:18px">Route another lead</button>
  </div>

</div>
</main>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://tvrqhnklnmtrachqackj.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_SqQrBjFymVrwwvH-GSu_Uw_qGnz_bcL';
  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // ---- element refs ----
  const el = (id) => document.getElementById(id);
  const views = {
    login: el('loginView'), entry: el('entryView'), proposal: el('proposalView'), success: el('successView'),
  };
  function showView(name) {
    Object.values(views).forEach((v) => v.classList.add('hidden'));
    views[name].classList.remove('hidden');
  }
  function showError(boxId, message) {
    const box = el(boxId);
    box.textContent = message;
    box.classList.remove('hidden');
  }
  function clearError(boxId) {
    el(boxId).classList.add('hidden');
    el(boxId).textContent = '';
  }
  function initials(name) {
    if (!name) return '—';
    return name.trim().slice(0, 2).toUpperCase();
  }

  // ---- state ----
  let session = null;
  let hospitality = false;
  let currentLead = null;       // lead_queue row
  let currentSession = null;    // assignment_session row (+ repName, ttv attached)

  // ---- auth ----
  async function init() {
    const { data } = await supabase.auth.getSession();
    session = data.session;
    render();
    supabase.auth.onAuthStateChange((_event, s) => { session = s; render(); });
  }

  function render() {
    if (!session) {
      el('whoBox').classList.add('hidden');
      showView('login');
      return;
    }
    el('whoBox').classList.remove('hidden');
    el('whoEmail').textContent = session.user.email;
    if (currentSession) showView('proposal');
    else showView('entry');
  }

  el('googleBtn').addEventListener('click', async () => {
    clearError('loginError');
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + window.location.pathname,
        queryParams: { hd: 'shift4.com' },
      },
    });
    if (error) showError('loginError', error.message);
  });

  el('signOutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    resetToEntry();
  });

  // ---- hospitality toggle ----
  el('hospNoBtn').addEventListener('click', () => setHospitality(false));
  el('hospYesBtn').addEventListener('click', () => setHospitality(true));
  function setHospitality(val) {
    hospitality = val;
    el('hospNoBtn').classList.toggle('active', !val);
    el('hospYesBtn').classList.toggle('active', val);
  }

  // ---- create lead + propose ----
  el('getAssignmentBtn').addEventListener('click', async () => {
    clearError('entryError');
    const ttv = Number(el('ttvInput').value);
    if (!ttv || ttv <= 0) { showError('entryError', 'Enter a valid TTV amount.'); return; }

    el('getAssignmentBtn').disabled = true;
    try {
      const { data: lead, error: leadErr } = await supabase
        .from('lead_queue')
        .insert({
          bdr_user_id: session.user.id,
          bdr_email: session.user.email,
          ttv,
          hospitality,
        })
        .select()
        .single();
      if (leadErr) throw leadErr;
      currentLead = lead;
      await propose(lead.id);
    } catch (err) {
      showError('entryError', err.message || String(err));
    } finally {
      el('getAssignmentBtn').disabled = false;
    }
  });

  async function propose(leadId) {
    const { data, error } = await supabase.rpc('propose_assignment', { p_lead_queue_id: leadId });
    if (error) { showError('entryError', error.message); return; }
    await attachRepAndShow(data);
  }

  async function attachRepAndShow(assignmentSession) {
    const { data: rep } = await supabase.from('reps').select('name').eq('id', assignmentSession.proposed_rep_id).single();
    currentSession = { ...assignmentSession, repName: rep ? rep.name : '(unknown)' };
    el('assignmentType').textContent = currentSession.assignment_type;
    el('repName').textContent = currentSession.repName;
    el('repAvatar').textContent = initials(currentSession.repName);
    el('repVolume').textContent = '$' + Number(currentSession.raw_volume).toLocaleString();
    clearError('proposalError');
    await refreshRecallButton();
    showView('proposal');
  }

  async function refreshRecallButton() {
    const { data: lead } = await supabase
      .from('lead_queue')
      .select('last_skipped_rep_id')
      .eq('id', currentLead.id)
      .single();
    const recallBtn = el('recallBtn');
    if (lead && lead.last_skipped_rep_id) {
      const { data: rep } = await supabase.from('reps').select('name').eq('id', lead.last_skipped_rep_id).single();
      recallBtn.textContent = 'DIRECT LOG TO ' + (rep ? rep.name.toUpperCase() : '—');
      recallBtn.classList.remove('hidden');
    } else {
      recallBtn.classList.add('hidden');
    }
  }

  // ---- YES / NO / RECALL / CANCEL ----
  el('yesBtn').addEventListener('click', async () => {
    clearError('proposalError');
    const { data, error } = await supabase.rpc('confirm_assignment', { p_session_id: currentSession.id });
    if (error) { showError('proposalError', error.message); return; }
    showSuccess(`Logged to ${currentSession.repName}.`);
  });

  el('noBtn').addEventListener('click', async () => {
    clearError('proposalError');
    const { data, error } = await supabase.rpc('skip_assignment', { p_session_id: currentSession.id });
    if (error) { showError('proposalError', error.message); return; }
    await attachRepAndShow(data);
  });

  el('recallBtn').addEventListener('click', async () => {
    clearError('proposalError');
    const { data, error } = await supabase.rpc('recall_last_skipped', { p_session_id: currentSession.id });
    if (error) { showError('proposalError', error.message); return; }
    showSuccess('Logged to the recalled rep.');
  });

  // Cancel: surface any RPC error inline instead of silently swallowing it.
  el('cancelBtn').addEventListener('click', async () => {
    clearError('proposalError');
    if (currentSession) {
      const { error } = await supabase.rpc('cancel_assignment', { p_session_id: currentSession.id });
      if (error) {
        showError('proposalError', 'Cancel failed: ' + error.message);
        return;
      }
    }
    resetToEntry();
  });

  el('nextLeadBtn').addEventListener('click', resetToEntry);

  function showSuccess(message) {
    el('successMessage').textContent = message;
    showView('success');
  }

  function resetToEntry() {
    currentLead = null;
    currentSession = null;
    el('ttvInput').value = '';
    setHospitality(false);
    clearError('entryError');
    clearError('proposalError');
    render();
  }

  init();
</script>

</body>
</html>
